<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InfraHub · TVs</title>
<style>
:root {
  --bg:#0A0E17; --panel:#101522; --panel2:#161D30; --line:#262F47;
  --accent:#F2793A; --blue:#3E7BF2; --green:#35D07F; --red:#EF5A5A;
  --text:#EDF1F7; --dim:#8792AB;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;padding:18px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:12px}
.dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--blue));box-shadow:0 0 14px rgba(242,121,58,.45)}
h1{font-family:monospace;margin:0;font-size:1.7rem}
.subtitle{color:var(--dim);font-size:.85rem;margin:3px 0 0}
.clock{text-align:right;font-family:monospace;font-size:1.3rem}
.api-status{font-size:.75rem;color:var(--dim);margin-top:3px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat-label{font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.stat-value{font-family:monospace;font-size:1.8rem;font-weight:700;margin-top:4px}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.toolbar-left,.toolbar-right{display:flex;gap:8px;align-items:center}
button,input{font:inherit;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:7px 10px}
button{cursor:pointer;font-family:monospace;font-size:.75rem}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);color:var(--bg);border:none;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tv{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:15px;position:relative}
.tv.online{border-color:rgba(53,208,127,.35)}
.tv.offline{border-color:rgba(239,90,90,.35)}
.tv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tv-name{font-size:1.05rem;font-weight:700}
.tv-id{font: .72rem monospace;color:var(--dim);margin-top:3px}
.badge{display:flex;align-items:center;gap:5px;font: .7rem monospace;padding:4px 7px;border-radius:999px;border:1px solid var(--line)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.online .badge i{background:var(--green);box-shadow:0 0 8px rgba(53,208,127,.6)}
.offline .badge i{background:var(--red)}
.info{margin:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:.78rem}
.row span:first-child{color:var(--dim)}
.good{color:var(--green)} .bad{color:var(--red)}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.actions button{flex:1;min-width:120px}
.url-edit{display:flex;gap:6px;margin-top:8px}
.url-edit input{width:100%;min-width:0;font-size:.72rem}
.url-edit button{flex:0 0 auto}
.tv{min-width:0}
.grid{align-items:start}
.empty{padding:35px;text-align:center;color:var(--dim)}
#error{color:var(--red);font: .75rem monospace;margin-top:8px}
@media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start}.toolbar{flex-direction:column;align-items:stretch}.toolbar-left,.toolbar-right{flex-wrap:wrap}}
</style>
</head>
<body>
<header>
  <div class="logo">
    <span class="dot"></span>
    <div>
      <h1>InfraHub · TVs</h1>
      <div class="subtitle">Monitoramento das telas · Vera Cruz · Braga IT</div>
    </div>
  </div>
  <div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="api-status" id="apiStatus">API: verificando...</div>
  </div>
</header>

<section class="summary">
  <div class="card"><div class="stat-label">Online</div><div class="stat-value good" id="online">0</div></div>
  <div class="card"><div class="stat-label">Offline</div><div class="stat-value bad" id="offline">0</div></div>
  <div class="card"><div class="stat-label">Total</div><div class="stat-value" id="total">0</div></div>
  <div class="card"><div class="stat-label">Última atualização</div><div class="stat-value" id="updated" style="font-size:1rem">--:--:--</div></div>
</section>

<div class="toolbar">
  <div class="toolbar-left">
    <button class="primary" onclick="carregar()">↻ Atualizar</button>
    <input id="filtro" placeholder="Filtrar TV..." oninput="render()">
  </div>
  <div class="toolbar-right">
    <button onclick="history.back()">← Voltar</button>
  </div>
</div>

<div id="error"></div>
<main class="grid" id="grid"><div class="empty">Carregando TVs...</div></main>

<script>
let maquinas = [];

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function online(m) {
  if (typeof m.online === 'boolean') return m.online;
  const hb = m.ultimo_heartbeat || m.last_heartbeat || m.heartbeat_at;
  if (!hb) return false;
  return Date.now() - new Date(hb).getTime() < 90000;
}

function heartbeat(m) {
  const hb = m.ultimo_heartbeat || m.last_heartbeat || m.heartbeat_at;
  if (!hb) return 'Nunca';
  const d = Date.now() - new Date(hb).getTime();
  if (d < 1000) return 'agora';
  if (d < 60000) return Math.floor(d/1000) + 's atrás';
  if (d < 3600000) return Math.floor(d/60000) + 'min atrás';
  return new Date(hb).toLocaleString('pt-BR');
}

function render() {
  const filtro = document.getElementById('filtro').value.toLowerCase();
  const lista = maquinas.filter(m => `${m.nome||''} ${m.id||m.maquina_id||''}`.toLowerCase().includes(filtro));
  const on = maquinas.filter(online).length;
  document.getElementById('online').textContent = on;
  document.getElementById('offline').textContent = maquinas.length - on;
  document.getElementById('total').textContent = maquinas.length;
  document.getElementById('updated').textContent = new Date().toLocaleTimeString('pt-BR');

  const grid = document.getElementById('grid');
  if (!lista.length) {
    grid.innerHTML = '<div class="empty">Nenhuma TV encontrada.</div>';
    return;
  }

  grid.innerHTML = lista.map(m => {
    const id = m.id || m.maquina_id;
    const isOn = online(m);
    const atual = m.url_atual || m.urlAtual || '—';
    const esperada = m.url_esperada || m.urlEsperada || '—';
    const urlOk = atual !== '—' && esperada !== '—' ? atual === esperada : null;
    return `<article class="tv ${isOn ? 'online':'offline'}">
      <div class="tv-head">
        <div>
          <div class="tv-name">${esc(m.nome || id)}</div>
          <div class="tv-id">${esc(id)}</div>
        </div>
        <div class="badge"><i></i>${isOn ? 'ONLINE':'OFFLINE'}</div>
      </div>
      <div class="info">
        <div class="row"><span>Heartbeat</span><strong>${esc(heartbeat(m))}</strong></div>
        <div class="row"><span>URL atual</span><strong title="${esc(atual)}">${esc(atual.length > 35 ? atual.slice(0,35)+'…' : atual)}</strong></div>
        <div class="row"><span>URL esperada</span><strong class="${urlOk === false ? 'bad' : urlOk === true ? 'good':''}">${urlOk === true ? '✓ Correta' : urlOk === false ? '✕ Diferente' : esc(esperada)}</strong></div>
        <div class="url-edit" id="edit-${esc(id)}" hidden>
          <input id="url-${esc(id)}" type="url" value="${esc(esperada === '—' ? '' : esperada)}" placeholder="https://exemplo.vercel.app">
          <button onclick="salvarUrl('${esc(id)}')">Salvar</button>
          <button onclick="cancelarUrl('${esc(id)}')">Cancelar</button>
        </div>
      </div>
      <div class="actions">
        <button onclick="comando('${esc(id)}','reload')">↻ Recarregar</button>
        <button onclick="editarUrl('${esc(id)}')">✎ URL esperada</button>
      </div>
    </article>`;
  }).join('');
}

async function carregar() {
  const status = document.getElementById('apiStatus');
  const err = document.getElementById('error');
  err.textContent = '';
  status.textContent = 'API: consultando...';
  try {
    const r = await fetch('/api/tvs-maquinas', { cache:'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    maquinas = Array.isArray(data) ? data : (data.maquinas || data.data || []);
    status.textContent = 'API: online';
    render();
  } catch (e) {
    status.textContent = 'API: erro';
    err.textContent = `Não foi possível carregar as TVs: ${e.message}`;
    maquinas = [];
    render();
  }
}

function editarUrl(id) {
  const el = document.getElementById(`edit-${id}`);
  const input = document.getElementById(`url-${id}`);
  if (!el || !input) return;
  el.hidden = false;
  input.focus();
  input.select();
}

function cancelarUrl(id) {
  const el = document.getElementById(`edit-${id}`);
  if (el) el.hidden = true;
}

async function salvarUrl(id) {
  const input = document.getElementById(`url-${id}`);
  const url = input?.value.trim() || '';

  if (!url) {
    alert('Informe a URL esperada.');
    return;
  }

  try {
    const parsed = new URL(url);
    if (!['http:', 'https:'].includes(parsed.protocol)) throw new Error();
  } catch {
    alert('URL inválida. Use http:// ou https://');
    return;
  }

  try {
    const r = await fetch('/api/tvs-maquinas', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, url_esperada: url })
    });

    const data = await r.json().catch(() => ({}));

    if (!r.ok) throw new Error(data.erro || `HTTP ${r.status}`);

    const m = maquinas.find(item => (item.id || item.maquina_id) === id);
    if (m) m.url_esperada = data.maquina?.url_esperada || url;

    render();
  } catch (e) {
    alert('Erro ao salvar URL esperada: ' + e.message);
  }
}

async function comando(maquinaId, tipo) {
  try {
    const r = await fetch('/api/tvs-comando', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ maquina_id:maquinaId, tipo, payload:{} })
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    alert('Comando enviado.');
  } catch(e) {
    alert('Erro ao enviar comando: ' + e.message);
  }
}

function tick() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('pt-BR');
}
tick();
setInterval(tick,1000);
carregar();
setInterval(carregar,30000);
</script>
</body>
</html>
