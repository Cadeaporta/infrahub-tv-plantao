
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InfraHub · Plantão & Escala</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0A0E17;
    --panel: #101522;
    --panel-2: #161D30;
    --line: #262F47;
    --accent: #F2793A;
    --accent-2: #3E7BF2;
    --text: #EDF1F7;
    --text-dim: #8792AB;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding: 10px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
  }

  .scroll-area {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .scroll-area::-webkit-scrollbar { width: 8px; }
  .scroll-area::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  .logo-row { display: flex; align-items: center; gap: 12px; }

  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(242,121,58,0.5); }
    50% { opacity: 0.6; box-shadow: 0 0 0 8px rgba(242,121,58,0); }
  }

  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.9rem;
    margin: 0;
    font-weight: 700;
  }

  .subtitle { color: var(--text-dim); font-size: 0.85rem; margin-top: 1px; }

  .clock-box { text-align: right; }
  .clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2.3rem;
    font-weight: 700;
    line-height: 1;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .date { color: var(--text-dim); font-size: 0.95rem; text-transform: capitalize; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    flex-shrink: 0;
  }

  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 14px;
  }

  .card h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 0 6px 0;
  }

  /* Escala */
  .membro-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 2px;
    border-bottom: 1px solid var(--line);
  }
  .membro-row:last-child { border-bottom: none; }

  .membro-info { display: flex; align-items: center; gap: 10px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
  .status-dot.ativo { background: var(--accent); animation: pulse 2s ease-in-out infinite; }

  .membro-nome { font-size: 1.25rem; }
  .membro-horario { font-family: 'JetBrains Mono', monospace; color: var(--text-dim); font-size: 1rem; }

  .membro-actions { display: flex; gap: 6px; opacity: 0; transition: opacity 0.15s; }
  .membro-row:hover .membro-actions { opacity: 1; }

  /* Plantão */
  .plantao-hoje {
    text-align: center;
    padding: 8px 0;
  }
  .plantao-nome {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2.8rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    cursor: pointer;
  }
  .plantao-horario { color: var(--text-dim); font-size: 1.15rem; margin-top: 4px; }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .cal-mes {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    text-transform: capitalize;
  }
  .cal-nav { display: flex; gap: 6px; align-items: center; }
  .cal-nav button { font-size: 0.7rem; padding: 4px 8px; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }
  .cal-dow {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-dim);
    padding-bottom: 4px;
  }
  .cal-dia {
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--bg);
    min-height: 50px;
    padding: 4px 6px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .cal-dia:hover { border-color: var(--accent); }
  .cal-dia.fds { border-color: rgba(62,123,242,0.35); background: rgba(62,123,242,0.06); }
  .cal-dia.hoje {
    border-color: var(--accent);
    border-width: 2px;
    background: rgba(242,121,58,0.08);
    box-shadow: 0 0 0 1px rgba(242,121,58,0.25);
  }
  .cal-dia .num { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--text-dim); }
  .cal-dia.hoje .num { color: var(--accent); font-weight: 700; }
  .cal-dia .horario { font-size: 0.6rem; color: var(--text-dim); text-align: right; }
  .cal-dia .nome { font-size: 0.92rem; font-weight: 500; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cal-dia .nome.vazio { color: var(--text-dim); font-weight: 400; }
  .cal-vazio { min-height: 50px; }

  .ronda-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 7px;
  }
  .ronda-item {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    padding: 7px 6px;
    text-align: center;
  }
  .ronda-item.atual {
    border-color: var(--accent);
    border-width: 2px;
    background: rgba(242,121,58,0.08);
  }
  .ronda-item .semana-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .ronda-item .semana-nome {
    font-size: 1rem;
    cursor: pointer;
  }
  .ronda-item .semana-nome:hover { color: var(--accent); }
  .ronda-nav {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .ronda-nav span {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-dim);
    font-size: 0.78rem;
  }

  .cal-dia .horas { color: var(--accent); font-weight: 700; font-size: 0.75rem; }

  input, select, button {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 9px;
  }
  button {
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.remover:hover { border-color: #EF5A5A; color: #EF5A5A; }
  button.principal {
    background: var(--accent);
    color: var(--bg);
    font-weight: 700;
    border: none;
  }
  button.principal:hover { opacity: 0.9; color: var(--bg); }

  .add-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }
  .add-row input { flex: 1; }

  .config-toggle {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.15;
    transition: opacity 0.2s;
    font-size: 1rem;
    z-index: 10;
  }
  .config-toggle:hover { opacity: 1; }

  body.modo-edicao .membro-actions,
  body.modo-edicao .config-toggle { opacity: 1; }

  /* ---- Responsivo: tablet e celular ---- */
  @media (max-width: 900px) {
    html, body { height: auto; min-height: 100%; }
    body { overflow: auto; padding: 12px; gap: 12px; }
    .scroll-area { flex: none; overflow: visible; }
    header { flex-wrap: wrap; gap: 8px; }
    .clock-box { text-align: left; }
  }

  @media (max-width: 700px) {
    h1 { font-size: 1.5rem; }
    .clock { font-size: 1.8rem; }
    .plantao-nome { font-size: 2.2rem; }
    .cal-grid { gap: 3px; }
    .cal-dia { min-height: 44px; padding: 3px 4px; }
    .cal-vazio { min-height: 44px; }
    .cal-dia .nome { font-size: 0.72rem; }
    .cal-dia .num { font-size: 0.68rem; }
    .cal-dia .horario { display: none; }
    .ronda-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
  }

  @media (max-width: 480px) {
    .ronda-grid { grid-template-columns: repeat(2, 1fr); }
    .add-row { flex-wrap: wrap; }
    .add-row input, .add-row select, .add-row button { flex: 1 1 100%; }
    .membro-row { flex-wrap: wrap; gap: 4px; }
    .cal-nav { width: 100%; }
    .cal-nav button { flex: 1 1 auto; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body>

<button class="config-toggle" onclick="document.body.classList.toggle('modo-edicao')" title="Mostrar/esconder edição">⚙</button>

<header>
  <div class="logo-row">
    <span class="dot"></span>
    <div>
      <h1>InfraHub</h1>
      <p class="subtitle">Vera Cruz · Braga IT</p>
    </div>
  </div>
  <div class="clock-box">
    <div class="clock" id="relogio">--:--</div>
    <div class="date" id="dataAtual"></div>
  </div>
</header>

<div class="grid">

  <!-- Horário de trabalho -->
  <div class="card">
    <h2>Horário de trabalho</h2>
    <div id="listaEquipe"></div>

    <div class="add-row">
      <input id="novoNomeEquipe" placeholder="Nome" />
      <select id="novaEntradaEquipe">
        <option value="7">7:00 – 16:00</option>
        <option value="8" selected>8:00 – 17:00</option>
        <option value="9">9:00 – 18:00</option>
        <option value="10">10:00 – 19:00</option>
      </select>
      <button class="principal" onclick="adicionarMembro()">Adicionar</button>
    </div>

  <!-- Plantão de hoje -->
  <div class="card">
    <h2>Plantão de hoje</h2>
    <div class="plantao-hoje">
      <div class="plantao-nome" id="plantaoNomeHoje" onclick="editarPlantaoHoje()">—</div>
      <div class="plantao-horario" id="plantaoHorarioHoje"></div>
    </div>
  </div>

</div>

<div class="scroll-area">
  <div class="card">
    <div class="cal-header">
      <h2 style="margin:0;">Calendário de plantão</h2>
      <div class="cal-nav">
        <button onclick="mudarMes(-1)">← Anterior</button>
        <span class="cal-mes" id="calMesLabel"></span>
        <button onclick="mudarMes(1)">Próximo →</button>
        <button onclick="document.getElementById('inputImportarPlantao').click()">📥 Importar Excel/CSV</button>
        <button onclick="abrirAleatorizadorPlantao()">🎲 Aleatorizar</button>
        <input type="file" id="inputImportarPlantao" accept=".xlsx,.xls,.csv" style="display:none" onchange="importarPlantaoArquivo(event)" />
      </div>
      <div id="aleatorizadorPlantao" style="display:none; margin: 8px 0 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);">
        <label for="nomesAleatorizador" style="display:block; color:var(--text-dim); font-size:0.78rem; margin-bottom:6px;">Insira os nomes dos plantonistas, um por linha:</label>
        <textarea id="nomesAleatorizador" rows="4" placeholder="Guilherme&#10;Pedro&#10;João" style="width:100%; resize:vertical; font-family:Inter,sans-serif; font-size:0.85rem; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:7px 9px;"></textarea>
        <div style="display:flex; gap:6px; margin-top:7px; justify-content:flex-end; flex-wrap:wrap;">
          <button onclick="fecharAleatorizadorPlantao()">Cancelar</button>
          <button class="principal" onclick="aleatorizarPlantaoMes()">Gerar escala</button>
        </div>
      </div>
      </div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="card" style="margin-top: 12px;">
    <h2>Ronda CMD · 8:00 – 12:00</h2>
    <div class="ronda-grid" id="rondaGrid"></div>
    <div class="ronda-nav">
      <button onclick="mudarSemanaRonda(-1)">← Semana anterior</button>
      <span id="rondaAtualLabel"></span>
      <button onclick="mudarSemanaRonda(1)">Próxima semana →</button>
    </div>
  </div>
</div>

<div style="position: fixed; bottom: 4px; right: 8px; font-size: 0.6rem; color: var(--text-dim); opacity: 0.4; font-family: monospace;">build-2026-08-28-supabase</div>

<script>
  // ---------- Supabase ----------
  const SUPABASE_URL = 'https://koiiqafjmlnsdkijnwmi.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Uv8bl8Ont7pAQju9WrBJww_aoR2KTSp';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let equipe = [];
  let plantoes = {};
  let ronda = [];

  async function carregarEquipeRemoto() {
    const { data, error } = await supabaseClient.from('escala_equipe').select('*').order('entrada');
    if (error) { console.error('[InfraHub] erro ao carregar equipe:', error); return []; }
    return data;
  }

  async function carregarPlantoesRemoto() {
    const { data, error } = await supabaseClient.from('plantoes').select('*');
    if (error) { console.error('[InfraHub] erro ao carregar plantoes:', error); return {}; }
    const mapa = {};
    data.forEach(p => { mapa[p.data] = p.nome; });
    return mapa;
  }

  async function carregarRondaRemoto() {
    const { data, error } = await supabaseClient.from('ronda_cmd').select('*').order('ordem');
    if (error) { console.error('[InfraHub] erro ao carregar ronda:', error); return []; }
    return data;
  }

  function atualizarRelogio() {
    const agora = new Date();
    document.getElementById('relogio').textContent = agora.toLocaleTimeString('pt-BR', {
      hour: '2-digit', minute: '2-digit'
    });
    document.getElementById('dataAtual').textContent = agora.toLocaleDateString('pt-BR', {
      weekday: 'long', day: '2-digit', month: 'long'
    });
  }

  function isoDia(d) {
    const ano = d.getFullYear();
    const mes = String(d.getMonth() + 1).padStart(2, '0');
    const dia = String(d.getDate()).padStart(2, '0');
    return `${ano}-${mes}-${dia}`;
  }

  function ehFimDeSemana(d) { return d.getDay() === 0 || d.getDay() === 6; }

  function diaOperacional() {
    const agora = new Date();
    if (agora.getHours() < 7) {
      agora.setDate(agora.getDate() - 1);
    }
    return agora;
  }

  function renderEquipe() {
    const agora = new Date();
    const horaAtual = agora.getHours() + agora.getMinutes() / 60;
    const fds = ehFimDeSemana(agora);

    const container = document.getElementById('listaEquipe');
    container.innerHTML = '';

    if (equipe.length === 0) {
      container.innerHTML = '<p style="color:var(--text-dim)">Ninguém cadastrado ainda.</p>';
    }

    equipe.forEach(m => {
      const presente = !fds && horaAtual >= m.entrada && horaAtual < m.entrada + 9;
      const row = document.createElement('div');
      row.className = 'membro-row';
      row.innerHTML = `
        <div class="membro-info">
          <span class="status-dot ${presente ? 'ativo' : ''}"></span>
          <span class="membro-nome">${m.nome}</span>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="membro-horario">${m.entrada}:00 – ${m.entrada + 9}:00</span>
          <div class="membro-actions">
            <button onclick="editarMembro('${m.id}')">Editar</button>
            <button class="remover" onclick="removerMembro('${m.id}')">Remover</button>
          </div>
        </div>
      `;
      container.appendChild(row);
    });
  }

  function renderRonda() {
    const container = document.getElementById('rondaGrid');
    container.innerHTML = '';

    ronda.forEach((r, i) => {
      const item = document.createElement('div');
      item.className = 'ronda-item' + (r.atual ? ' atual' : '');
      item.innerHTML = `
        <div class="semana-label">Semana ${r.ordem}</div>
        <div class="semana-nome" onclick="editarRondaMembro(${i})">${r.nome || '—'}</div>
      `;
      container.appendChild(item);
    });

    const atual = ronda.find(r => r.atual);
    document.getElementById('rondaAtualLabel').textContent =
      `Semana atual: ${atual ? atual.ordem : '-'} — ${atual?.nome || '—'}`;
  }

  async function editarRondaMembro(indice) {
    const r = ronda[indice];
    if (!r) return;
    const novoNome = prompt(`Nome da Semana ${r.ordem}:`, r.nome || '');
    if (novoNome === null) return;
    const { error } = await supabaseClient.from('ronda_cmd').update({ nome: novoNome.trim() }).eq('id', r.id);
    if (error) { alert('Erro ao salvar: ' + error.message); return; }
    r.nome = novoNome.trim();
    renderRonda();
  }

  async function mudarSemanaRonda(delta) {
    if (ronda.length === 0) return;
    const total = ronda.length;
    const atualIdx = ronda.findIndex(r => r.atual);
    const idxBase = atualIdx >= 0 ? atualIdx : 0;
    const novoIdx = (idxBase + delta + total) % total;

    if (atualIdx >= 0) {
      const { error: e1 } = await supabaseClient.from('ronda_cmd').update({ atual: false }).eq('id', ronda[atualIdx].id);
      if (e1) { alert('Erro ao trocar semana: ' + e1.message); return; }
      ronda[atualIdx].atual = false;
    }

    const { error: e2 } = await supabaseClient.from('ronda_cmd').update({ atual: true }).eq('id', ronda[novoIdx].id);
    if (e2) { alert('Erro ao trocar semana: ' + e2.message); return; }
    ronda[novoIdx].atual = true;

    renderRonda();
  }

  async function adicionarMembro() {
    const nomeInput = document.getElementById('novoNomeEquipe');
    const entradaInput = document.getElementById('novaEntradaEquipe');
    const nome = nomeInput.value.trim();
    const entrada = Number(entradaInput.value);
    if (!nome) return;

    const { data, error } = await supabaseClient.from('escala_equipe').insert({ nome, entrada }).select().single();
    if (error) { alert('Erro ao adicionar: ' + error.message); return; }

    equipe.push(data);
    equipe.sort((a, b) => a.entrada - b.entrada);
    nomeInput.value = '';
    renderEquipe();
  }

  async function editarMembro(id) {
    const m = equipe.find(x => x.id === id);
    if (!m) return;
    const novoNome = prompt('Nome:', m.nome);
    if (novoNome === null) return;
    const novaEntrada = prompt('Entrada (7, 8, 9 ou 10):', m.entrada);
    if (novaEntrada === null) return;

    const nome = novoNome.trim() || m.nome;
    const entrada = [7, 8, 9, 10].includes(Number(novaEntrada)) ? Number(novaEntrada) : m.entrada;

    const { error } = await supabaseClient.from('escala_equipe').update({ nome, entrada }).eq('id', id);
    if (error) { alert('Erro ao salvar: ' + error.message); return; }

    m.nome = nome;
    m.entrada = entrada;
    renderEquipe();
  }

  async function removerMembro(id) {
    const { error } = await supabaseClient.from('escala_equipe').delete().eq('id', id);
    if (error) { alert('Erro ao remover: ' + error.message); return; }
    equipe = equipe.filter(x => x.id !== id);
    renderEquipe();
  }

  let mesAtual = new Date();
  mesAtual.setDate(1);

  const DOW = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

  function renderPlantaoHoje() {
    const hoje = diaOperacional();
    const hojeISO = isoDia(hoje);
    document.getElementById('plantaoNomeHoje').textContent = plantoes[hojeISO] || '—';
    document.getElementById('plantaoHorarioHoje').textContent = ehFimDeSemana(hoje) ? '6h – 6h' : '19h – 7h';
  }

  function encontrarChave(linha, candidatos) {
    const chaves = Object.keys(linha);
    for (const candidato of candidatos) {
      const achada = chaves.find(k => k.trim().toLowerCase() === candidato);
      if (achada) return achada;
    }
    return null;
  }

  function paraDataISO(valor) {
    if (!valor) return null;

    if (valor instanceof Date && !isNaN(valor)) {
      return isoDia(valor);
    }

    const texto = String(valor).trim();

    const bt = texto.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if (bt) {
      let [, dia, mes, ano] = bt;
      if (ano.length === 2) ano = '20' + ano;
      const d = new Date(Number(ano), Number(mes) - 1, Number(dia));
      return isoDia(d);
    }

    const semAno = texto.match(/^(\d{1,2})[\/\-](\d{1,2})$/);
    if (semAno) {
      const [, dia, mes] = semAno;
      const d = new Date(new Date().getFullYear(), Number(mes) - 1, Number(dia));
      return isoDia(d);
    }

    const iso = texto.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (iso) {
      const [, ano, mes, dia] = iso;
      const d = new Date(Number(ano), Number(mes) - 1, Number(dia));
      return isoDia(d);
    }

    return null;
  }

  function importarPlantaoArquivo(event) {
    const arquivo = event.target.files[0];
    if (!arquivo) return;

    const leitor = new FileReader();
    leitor.onload = async (e) => {
      try {
        const dados = new Uint8Array(e.target.result);
        const planilha = XLSX.read(dados, { type: 'array', raw: true });
        const primeiraAba = planilha.Sheets[planilha.SheetNames[0]];
        const linhas = XLSX.utils.sheet_to_json(primeiraAba, { defval: null, raw: true });

        console.log('[InfraHub import] versão da lib XLSX:', XLSX.version);
        console.log('[InfraHub import] total de linhas lidas:', linhas.length);

        let importadas = 0;
        let ignoradas = 0;
        let primeiraDataImportada = null;
        const linhasParaSalvar = [];

        linhas.forEach((linha, idx) => {
          const chaveData = encontrarChave(linha, ['data', 'date', 'dia']);
          const chaveNome = encontrarChave(linha, ['plantonista', 'nome', 'responsavel', 'responsável']);

          if (!chaveData || !chaveNome) {
            ignoradas++;
            console.log(`[InfraHub import] linha ${idx}: SEM CHAVE reconhecida`, linha);
            return;
          }

          const dataISO = paraDataISO(linha[chaveData]);
          const nome = linha[chaveNome] ? String(linha[chaveNome]).trim() : '';

          if (!dataISO || !nome) {
            ignoradas++;
            console.log(`[InfraHub import] linha ${idx}: valor bruto="${linha[chaveData]}" -> dataISO="${dataISO}" nome="${nome}" (IGNORADA)`);
            return;
          }

          plantoes[dataISO] = nome;
          linhasParaSalvar.push({ data: dataISO, nome });
          importadas++;
          if (!primeiraDataImportada) primeiraDataImportada = dataISO;
        });

        if (linhasParaSalvar.length > 0) {
          const { error } = await supabaseClient.from('plantoes').upsert(linhasParaSalvar, { onConflict: 'data' });
          if (error) {
            alert('Importou localmente mas deu erro ao salvar no banco: ' + error.message);
            console.error(error);
          }
        }

        if (primeiraDataImportada) {
          const [ano, mes] = primeiraDataImportada.split('-').map(Number);
          mesAtual = new Date(ano, mes - 1, 1);
        }

        renderPlantaoHoje();
        renderCalendario();

        alert(`Importado: ${importadas} plantões.` + (ignoradas > 0 ? ` (${ignoradas} linhas ignoradas, sem data/nome reconhecido)` : ''));
      } catch (err) {
        alert('Não consegui ler esse arquivo. Confere se é um .xlsx ou .csv válido.');
        console.error(err);
      }
      event.target.value = '';
    };
    leitor.readAsArrayBuffer(arquivo);
  }

  function mudarMes(delta) {
    mesAtual.setMonth(mesAtual.getMonth() + delta);
    renderCalendario();
  }

  function abrirAleatorizadorPlantao() {
    const painel = document.getElementById('aleatorizadorPlantao');
    painel.style.display = 'block';
    document.getElementById('nomesAleatorizador').focus();
  }

  function fecharAleatorizadorPlantao() {
    document.getElementById('aleatorizadorPlantao').style.display = 'none';
  }

  async function aleatorizarPlantaoMes() {
    const entrada = document.getElementById('nomesAleatorizador').value;
    const nomes = [...new Set(entrada.split(/\r?\n|,/).map(nome => nome.trim()).filter(Boolean))];

    if (nomes.length === 0) {
      alert('Insira pelo menos um nome.');
      return;
    }

    const ano = mesAtual.getFullYear();
    const mes = mesAtual.getMonth();
    const totalDias = new Date(ano, mes + 1, 0).getDate();
    const datas = Array.from({ length: totalDias }, (_, i) => isoDia(new Date(ano, mes, i + 1)));

    const escala = Array.from({ length: totalDias }, (_, i) => nomes[i % nomes.length]);

    for (let i = escala.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [escala[i], escala[j]] = [escala[j], escala[i]];
    }

    const linhas = datas.map((data, i) => ({ data, nome: escala[i] }));
    const { error } = await supabaseClient.from('plantoes').upsert(linhas, { onConflict: 'data' });

    if (error) {
      alert('Erro ao gerar a escala: ' + error.message);
      return;
    }

    linhas.forEach(linha => { plantoes[linha.data] = linha.nome; });
    renderPlantaoHoje();
    renderCalendario();
    fecharAleatorizadorPlantao();
    document.getElementById('nomesAleatorizador').value = '';

    const base = Math.floor(totalDias / nomes.length);
    const extras = totalDias % nomes.length;
    alert(`Escala gerada para ${totalDias} dias. Cada plantonista ficou com ${base}${extras ? ` ou ${base + 1}` : ''} plantão(ões).`);
  }

    function horasDoDia(d) { return ehFimDeSemana(d) ? 24 : 12; }

  function renderCalendario() {
    const ano = mesAtual.getFullYear();
    const mes = mesAtual.getMonth();
    const primeiroDia = new Date(ano, mes, 1);
    const ultimoDia = new Date(ano, mes + 1, 0);
    const totalDias = ultimoDia.getDate();
    const offset = primeiroDia.getDay();
    const hojeISO = isoDia(diaOperacional());

    document.getElementById('calMesLabel').textContent = primeiroDia.toLocaleDateString('pt-BR', {
      month: 'long', year: 'numeric'
    });

    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    DOW.forEach(d => {
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      grid.appendChild(el);
    });

    for (let i = 0; i < offset; i++) {
      const vazio = document.createElement('div');
      vazio.className = 'cal-vazio';
      grid.appendChild(vazio);
    }

    for (let dia = 1; dia <= totalDias; dia++) {
      const data = new Date(ano, mes, dia);
      const dataISO = isoDia(data);
      const fds = ehFimDeSemana(data);
      const nome = plantoes[dataISO];

      const el = document.createElement('div');
      el.className = 'cal-dia' + (fds ? ' fds' : '') + (dataISO === hojeISO ? ' hoje' : '');
      el.onclick = () => editarPlantaoData(dataISO);
      el.innerHTML = `
        <div style="display:flex; justify-content:space-between;">
          <span class="num">${dia}</span>
          <span class="horario">${fds ? '6h-6h' : '19h-7h'}<br><span class="horas">${horasDoDia(data)}h</span></span>
        </div>
        <span class="nome ${nome ? '' : 'vazio'}">${nome || '—'}</span>
      `;
      grid.appendChild(el);
    }

  }

  function editarPlantaoHoje() {
    editarPlantaoData(isoDia(diaOperacional()));
  }

  async function editarPlantaoData(dataISO) {
    const atual = plantoes[dataISO] || '';
    const nome = prompt(`Quem tá de plantão em ${dataISO}?`, atual);
    if (nome === null) return;

    if (nome.trim() === '') {
      const { error } = await supabaseClient.from('plantoes').delete().eq('data', dataISO);
      if (error) { alert('Erro ao remover: ' + error.message); return; }
      delete plantoes[dataISO];
    } else {
      const { error } = await supabaseClient.from('plantoes').upsert({ data: dataISO, nome: nome.trim() }, { onConflict: 'data' });
      if (error) { alert('Erro ao salvar: ' + error.message); return; }
      plantoes[dataISO] = nome.trim();
    }

    renderPlantaoHoje();
    renderCalendario();
  }

  // ---------- Boot ----------
  async function carregarTudo() {
    [equipe, plantoes, ronda] = await Promise.all([
      carregarEquipeRemoto(),
      carregarPlantoesRemoto(),
      carregarRondaRemoto(),
    ]);
    renderEquipe();
    renderPlantaoHoje();
    renderCalendario();
    renderRonda();
  }

  atualizarRelogio();
  carregarTudo();

  setInterval(atualizarRelogio, 1000);
  // Re-sincroniza com o banco a cada 30s, pra pegar edições feitas em outro aparelho
  setInterval(carregarTudo, 30000);
</script>
